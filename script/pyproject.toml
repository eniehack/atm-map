[project]
name = "atmgeojsongen"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Nakaya" }
]
dependencies = [
    "geopandas>=1.0.1",
    "quackosm[cli]>=0.17.1",
    "typer>=0.25.1",
]
readme = "README.md"
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/atmjsongen"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
